[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databasise"
version = "0.1.0"
description = "Databasise 2.0 — the agnostic machine: fitting contract + versioned components over machine-owned primitives."
readme = "README.md"
requires-python = ">=3.11"
# Floor is deliberately higher than v1's ">=3.10" (v1/pyproject.toml:14): the runner uses stdlib
# asyncio.TaskGroup (3.11+) rather than taking an anyio dependency purely to preserve a 3.10 floor
# nothing in this phase needs. Legitimate because D-14 makes databasise/ a separate package that
# need not inherit v1's floor (01-RESEARCH.md Open Question 1; 01-01-PLAN.md decisions_recorded_here).
dependencies = [
    # Graph store primitive. Exact pin — Cozo 0.7.6 is architecture-frozen (D-05) with four known
    # correctness bugs and no upstream fixes expected; pin, do not range.
    "pycozo[embedded]==0.7.6",
    # Vector store primitive. Matches v1's existing bound (v1/pyproject.toml:48, D-05).
    "faiss-cpu>=1.7.0,<2.0.0",
    # RFC 8785 (JCS) canonicalisation for config_hash. Package-legitimacy gate approved
    # 2026-08-30 — see 01-01-SUMMARY.md for the recorded evidence.
    "rfc8785==0.1.4",
    "pydantic>=2.0,<3.0",
    # OpenAI-compatible LLM/embedding client (D-06/D-07) — one construction shape reaches
    # OpenRouter and a local Ollama endpoint alike via base_url override. Range widened past
    # v1/pyproject.toml's copied ">=2.0.0,<3.0.0" pin to ">=2.0.0,<4.0.0": querying PyPI
    # directly (03-01-PLAN.md Task 2's live-registry check) showed the current release is
    # 3.6.0, outside the copied upper bound, so the bound is widened to cover the current
    # major rather than pinning to a range PyPI itself has already moved past.
    "openai>=2.0.0,<4.0.0",
    # RFC 6902 JSON Patch application (D-13) — the arm-patch subtraction semantics
    # CONTRACT.md relies on for fail-closed arm removal. Package-legitimacy gate approved
    # 2026-08-30/31 — see 03-01-SUMMARY.md for the recorded evidence (prior executor run
    # surfaced the checkpoint; user approved both openai and jsonpatch).
    "jsonpatch",
]

# PEP 735 dependency group, not [project.optional-dependencies]: uv installs the `dev`
# group automatically for `uv run`, whereas an extra requires an explicit `--extra dev`.
# Every plan in this phase verifies with a bare `uv run pytest`, so the tooling must be
# present without a flag or each of those verify steps fails on a clean venv.
[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2",
    # Validates emitted run records against the frozen rig-trace.schema.json.
    "jsonschema>=4.0",
    "ruff",
    # Test-only (04-05, D-17): drives the REST transport in the dual-transport conformance
    # test via FastAPI's own httpx-based TestClient. Needed regardless of whether the `rest`
    # extra is installed. Version matches v1/pyproject.toml:87's existing pin. Package
    # legitimacy confirmed by the developer 2026-09-06 (see 04-CHECKPOINT-ANSWERS.md).
    "httpx>=0.28.1",
]

# 04-05 (D-15, EMBED-02, ROADMAP criterion 5): the optional REST transport. A
# [project.optional-dependencies] extra, deliberately NOT a [dependency-groups] group — a PEP 735
# group is not installable by an external consumer of the published package at all
# (`pip install package[group]` is not a thing), which would make EMBED-02's "optional layer
# anyone can opt into" false in practice. Installed as `databasise[rest]` or `uv sync --extra rest`.
# Package legitimacy confirmed by the developer 2026-09-06 (see 04-CHECKPOINT-ANSWERS.md).
[project.optional-dependencies]
rest = [
    # 0.135 is the first release to ship native fastapi.sse.EventSourceResponse (04-RESEARCH.md
    # Pattern 4) — pinning below that forces a hand-rolled SSE framer or an extra dependency
    # (sse-starlette) for no reason (Don't Hand-Roll table).
    "fastapi>=0.135",
    # ASGI server to run the optional REST app. Unconstrained, matching v1/pyproject.toml:95's
    # existing pin in this same monorepo.
    "uvicorn",
    # Required by FastAPI/Starlette to parse multipart/form-data (API-01's POST /documents/upload).
    # Package-legitimacy checkpoint confirmed 2026-09-08 (05-04-PLAN.md's pre-task checkpoint,
    # resolved: official FastAPI-documented companion package, github.com/Kludex/python-multipart).
    "python-multipart>=0.0.32",
]
# 05-04-PLAN.md (API-07): the MCP transport's own optional extra, separate from `rest` — plan
# 05-07 adds the new MCP transport package (a new subpackage of this same distribution) and
# wires it against this dependency in the same commit that adds that new subpackage's own entry
# to [tool.setuptools] packages below (never split across commits, so uv sync between the two
# plans never names a package directory that does not yet exist).
# Package-legitimacy checkpoint confirmed 2026-09-08 (05-04-PLAN.md's pre-task checkpoint,
# resolved: official Model Context Protocol SDK, github.com/modelcontextprotocol/python-sdk).
mcp = [
    "mcp>=2.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.setuptools]
# The `databasise` package root IS this project's own directory (pyproject.toml sits
# beside __init__.py, not in a parent dir) — remap the "databasise" package to "." and
# list subpackages explicitly, so setuptools' flat-layout auto-discovery doesn't mistake
# identity/, parts/, etc. for separate top-level packages.
package-dir = {"databasise" = "."}
packages = [
    "databasise",
    "databasise.identity",
    "databasise.parts",
    "databasise.parts_core",
    "databasise.parts_core.lightrag",
    "databasise.validator",
    "databasise.runner",
    "databasise.stores",
    "databasise.registry_artifact",
    "databasise.ledger",
    "databasise.evidence",
    "databasise.clients",
    "databasise.parity",
    "databasise.foreign",
    "databasise.wirings",
    "databasise.seam",
]

# The wiring documents ship with the package rather than existing only in a source checkout
# (Falsifier 2 evidence run, 02-01-PLAN.md Task 1).
[tool.setuptools.package-data]
"databasise.evidence" = ["wirings/*.json"]
# Widened from ["lightrag/*.json"] (05-06-PLAN.md Task 2F): databasise/wirings/codebase-memory-
# mcp.json now sits at the package root, not under lightrag/ — without this the new wiring ships
# in a source checkout and vanishes from an installed package, exactly the failure this same
# package-data entry was already widened once to prevent (Falsifier-2 evidence run precedent).
"databasise.wirings" = ["*.json", "lightrag/*.json"]

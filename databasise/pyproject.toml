[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databasise"
version = "0.1.0"
description = "Databasise 2.0 — the agnostic machine: fitting contract + versioned components over machine-owned primitives."
readme = "README.md"
requires-python = ">=3.11"
# Floor is deliberately higher than v1's ">=3.10" (v1/pyproject.toml:14): the runner uses stdlib
# asyncio.TaskGroup (3.11+) rather than taking an anyio dependency purely to preserve a 3.10 floor
# nothing in this phase needs. Legitimate because D-14 makes databasise/ a separate package that
# need not inherit v1's floor (01-RESEARCH.md Open Question 1; 01-01-PLAN.md decisions_recorded_here).
dependencies = [
    # Graph store primitive. Exact pin — Cozo 0.7.6 is architecture-frozen (D-05) with four known
    # correctness bugs and no upstream fixes expected; pin, do not range.
    "pycozo[embedded]==0.7.6",
    # Vector store primitive. Matches v1's existing bound (v1/pyproject.toml:48, D-05).
    "faiss-cpu>=1.7.0,<2.0.0",
    # RFC 8785 (JCS) canonicalisation for config_hash. Package-legitimacy gate approved
    # 2026-08-30 — see 01-01-SUMMARY.md for the recorded evidence.
    "rfc8785==0.1.4",
    "pydantic>=2.0,<3.0",
    # OpenAI-compatible LLM/embedding client (D-06/D-07) — one construction shape reaches
    # OpenRouter and a local Ollama endpoint alike via base_url override. Range widened past
    # v1/pyproject.toml's copied ">=2.0.0,<3.0.0" pin to ">=2.0.0,<4.0.0": querying PyPI
    # directly (03-01-PLAN.md Task 2's live-registry check) showed the current release is
    # 3.6.0, outside the copied upper bound, so the bound is widened to cover the current
    # major rather than pinning to a range PyPI itself has already moved past.
    "openai>=2.0.0,<4.0.0",
    # RFC 6902 JSON Patch application (D-13) — the arm-patch subtraction semantics
    # CONTRACT.md relies on for fail-closed arm removal. Package-legitimacy gate approved
    # 2026-08-30/31 — see 03-01-SUMMARY.md for the recorded evidence (prior executor run
    # surfaced the checkpoint; user approved both openai and jsonpatch).
    "jsonpatch",
]

# PEP 735 dependency group, not [project.optional-dependencies]: uv installs the `dev`
# group automatically for `uv run`, whereas an extra requires an explicit `--extra dev`.
# Every plan in this phase verifies with a bare `uv run pytest`, so the tooling must be
# present without a flag or each of those verify steps fails on a clean venv.
[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2",
    # Validates emitted run records against the frozen rig-trace.schema.json.
    "jsonschema>=4.0",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.setuptools]
# The `databasise` package root IS this project's own directory (pyproject.toml sits
# beside __init__.py, not in a parent dir) — remap the "databasise" package to "." and
# list subpackages explicitly, so setuptools' flat-layout auto-discovery doesn't mistake
# identity/, parts/, etc. for separate top-level packages.
package-dir = {"databasise" = "."}
packages = [
    "databasise",
    "databasise.identity",
    "databasise.parts",
    "databasise.parts_core",
    "databasise.parts_core.lightrag",
    "databasise.validator",
    "databasise.runner",
    "databasise.stores",
    "databasise.registry_artifact",
    "databasise.ledger",
    "databasise.evidence",
    "databasise.clients",
    "databasise.parity",
    "databasise.wirings",
    "databasise.seam",
]

# The wiring documents ship with the package rather than existing only in a source checkout
# (Falsifier 2 evidence run, 02-01-PLAN.md Task 1).
[tool.setuptools.package-data]
"databasise.evidence" = ["wirings/*.json"]
"databasise.wirings" = ["lightrag/*.json"]

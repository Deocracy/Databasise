  <dialog role="dialog" aria-label="Delete document" data-mock-id="shell.dialog.delete">
    <h2>Delete document</h2>
    <p>Delete document <strong class="mono" data-role="doc"></strong> using selector <strong class="mono" data-role="sel"></strong>? <span data-role="tail"></span></p>
    <p role="status" data-role="sending" hidden>Sending. A request that has been sent cannot be cancelled.</p>
    <p class="muted" role="status" data-role="write-note" hidden>Another write is in progress.</p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-outline" data-mock-id="shell.dialog.delete-cancel">Keep document</button>
      <button type="button" class="btn btn-destructive" data-mock-id="shell.dialog.delete-confirm"><span class="spinner" role="presentation" hidden></span> Delete</button>
    </div>
  </dialog>
